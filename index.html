<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20252b"><link rel="manifest" href="manifest.json"><title>G6 Simulator</title><style>
:root{--bg:#16191d;--panel:#252a30;--edge:#111418;--text:#eef1f4;--muted:#aeb5bd;--screen:#e9edf0;--screenText:#101316}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}.app{max-width:1050px;margin:auto;padding:14px}h1{font-size:20px;margin:4px 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}.instrument{background:linear-gradient(#3b4148,#20252b);border:8px solid var(--edge);border-radius:18px;padding:18px;box-shadow:0 12px 35px #0008}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700;letter-spacing:.08em}.badge{font-size:11px;color:#bfc6cd;border:1px solid #59616a;padding:3px 7px;border-radius:4px}.screenFrame{background:#aeb4ba;border:7px solid #111;border-radius:5px;padding:8px}.screen{background:var(--screen);color:var(--screenText);min-height:290px;border:1px solid #555;display:flex;flex-direction:column}.screenTitle{padding:7px 9px;border-bottom:2px solid #555;font-weight:700;display:flex;justify-content:space-between}.screenBody{padding:10px;flex:1;overflow:auto}.weight{font-size:50px;text-align:center;margin:24px 0 6px;font-variant-numeric:tabular-nums}.unit{text-align:center;font-size:15px}.status{text-align:center;margin:12px 0;font-size:13px}.bar{height:12px;background:#c5cbd0;border:1px solid #777}.bar>i{display:block;height:100%;background:#2649e8;width:10%}.levels{display:flex;gap:14px;justify-content:center;margin:14px 0;font-size:12px}.led{display:inline-block;width:12px;height:12px;border:1px solid #444;background:#fff;margin-left:4px}.on{background:#18c957}.menuList{border:1px solid #666;background:#fff}.menuItem{padding:8px 9px;border-bottom:1px solid #bbb;cursor:pointer}.menuItem:last-child{border:0}.menuItem.sel{background:#bfc2c5}.valueRow{display:flex;justify-content:space-between;gap:12px;padding:7px 4px;border-bottom:1px solid #c5c5c5}.valueRow b{font-weight:400}.valueRow strong{font-weight:700}.soft{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:5px}.soft button,.keypad button{min-height:38px;border:1px solid #8b8f93;background:linear-gradient(#f5f5f5,#c7c9cc);color:#17191c;border-radius:3px;font-weight:700;font-size:12px}.keypad{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}.keypad button{min-height:43px}.keypad button.dark{background:linear-gradient(#777d84,#4d5359);color:white}.controls{background:var(--panel);border:1px solid #3d444b;border-radius:10px;padding:13px}.controls h2{font-size:15px;margin:0 0 10px}.control{margin:12px 0}.control label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.control input[type=number],.control select{width:100%;padding:10px;border-radius:6px;border:1px solid #555;background:#15181b;color:white;font-size:16px}.control input[type=range]{width:100%}.row{display:flex;gap:8px}.row>*{flex:1}.btn{width:100%;padding:10px;border:1px solid #59616a;border-radius:6px;background:#353c43;color:white;font-weight:700}.note{font-size:11px;color:var(--muted);line-height:1.4}@media(max-width:780px){.layout{grid-template-columns:1fr}.controls{order:2}.instrument{padding:10px;border-width:6px}.screen{min-height:270px}.keypad{grid-template-columns:repeat(4,1fr)}.weight{font-size:42px}}
</style></head><body><div class="app"><h1>G6 Simulator</h1><div class="sub">Interaktiv simulering av BLH Nobel G6 PM • inga verkliga I/O är anslutna</div><div class="layout"><section class="instrument"><div class="brand"><span>BLH NOBEL</span><span class="badge">G6 MULTI CHANNEL</span></div><div class="screenFrame"><div class="screen" id="screen"></div></div><div class="soft" id="soft"></div><div class="keypad" id="keys"></div></section><aside class="controls"><h2>Simulerade insignaler</h2><div class="control"><label for="weightInput">Simulerad vikt, kg</label><input id="weightInput" type="number" min="-999999" max="999999" step="0.1" value="100"></div><div class="control"><input id="weightRange" type="range" min="0" max="1000" step="0.1" value="100"></div><div class="control"><label for="channel">Vald vågkanal</label><select id="channel"><option>1</option><option>2</option><option>3</option><option>4</option></select></div><div class="row"><button class="btn" id="motion">Motion: OFF</button><button class="btn" id="levels">Levels: ON</button></div><div class="control"><button class="btn" id="reset">Återställ simulering</button></div><p class="note">Förenklad lokal modell: vikt, tara, nollställning, max/min, nivåer och ackumulerad vikt simuleras i webbläsaren.</p></aside></div></div><script>
const mainMenu=['Levels','Setpoints','Preset Tare','Max/Min','Accumulated Weights','Clock Set-up','Parameter Set-up','System Information','Maintenance','Network Configuration'];const paramMenu=['General','Hardware Config.','Calibration','Communication','Level Supervision','Setpoints','Inputs','Outputs','Program Options'];const S={view:'weight',selected:0,weight:100,tare:0,gross:true,zero:0,motion:false,levels:true,levelValues:[50,150,250,500],max:100,min:100,accumulated:0,channel:1,name:'G6 DEMO',language:'English',displayMode:'1 & 2 & 4 Scales',filter:'Medium',capacity:1000,division:.1,tareMode:'Auto + Preset',sub:'',editValue:''};const $=id=>document.getElementById(id),screen=$('screen'),soft=$('soft'),keys=$('keys');function measured(){return S.weight-S.zero}function shown(){return S.gross?measured():measured()-S.tare}function f(v){return Number(v).toFixed(1)}function render(){if(S.view==='weight')weight();else if(S.view==='main')menu('Main Menu',mainMenu);else if(S.view==='param')menu('Parameter Set-up',paramMenu);else if(S.view==='sub')sub();else if(S.view==='edit')edit();else info()}function weight(){let w=shown();S.max=Math.max(S.max,w);S.min=Math.min(S.min,w);screen.innerHTML=`<div class="screenTitle"><span>${S.name}</span><span>Scale:${S.channel}</span></div><div class="screenBody"><div style="text-align:center;font-size:13px">${S.gross?'Gross':'Net'}</div><div class="weight">${f(w)}</div><div class="unit">kg</div><div class="status">${S.motion?'MOTION':'Stable'}</div><div class="bar"><i style="width:${Math.max(0,Math.min(100,w/S.capacity*100))}%"></i></div><div class="levels">${S.levelValues.map((x,i)=>`<span>${i+1}<i class="led ${S.levels&&w>=x?'on':''}"></i></span>`).join('')}</div><div style="font-size:11px;text-align:center">Tare: ${f(S.tare)} kg • Max: ${f(S.max)} • Min: ${f(S.min)}</div></div>`;soft.innerHTML=['P.Tare','Levels','MAX','MIN',''].map((x,i)=>`<button type="button" data-soft="${i}">${x||'&nbsp;'}</button>`).join('')}function menu(title,a){screen.innerHTML=`<div class="screenTitle">${title}<span>${a.length}</span></div><div class="screenBody"><div class="menuList">${a.map((x,i)=>`<div class="menuItem ${i===S.selected?'sel':''}" data-menu="${i}">${x}</div>`).join('')}</div></div>`;soft.innerHTML='<button data-act="enter">ENTER</button><button data-act="esc">ESC</button>'}function sub(){let t=S.sub,r=[];if(t==='General')r=[['Language',S.language],['Instrument Name',S.name],['Start Mode','Auto'],['Display Mode',S.displayMode],['Info Line 1 Mode','Batching Status'],['Info Line 2 Mode','Not In Use'],['Date Format','YYYY-MM-DD'],['Time Format','24 h'],['Gross/Net Key','On'],['Tare Key','On'],['F3 Key','P.Tare'],['F4 Key','Levels']];if(t==='Calibration')r=[['Scale 1 Capacity',S.capacity+' kg'],['Scale 1 Division',S.division+' kg'],['Tare Correction',S.tareMode],['Motion Check',S.motion?'On':'Off'],['Filter',S.filter]];if(t==='Hardware Config.')r=[['CPU','CPU module'],['Weight input','WFIN2'],['Channels','2'],['Display','5.7 inch TFT / touch'],['I/O','Demo configuration']];if(t==='Communication')r=[['Serial','RS485 / Modbus RTU'],['Ethernet','Modbus TCP'],['Fieldbus','Not fitted'],['Baudrate','115200']];if(t==='Level Supervision')r=S.levelValues.map((v,i)=>['Level '+(i+1),f(v)+' kg']);if(t==='Setpoints')r=[['Setpoint 1','100.0 kg'],['Setpoint 2','500.0 kg'],['Setpoint 3','750.0 kg']];if(t==='Inputs')r=[['Input 11','Zero'],['Input 12','Tare'],['Input 13','Gross/Net'],['Input 14','Print']];if(t==='Outputs')r=[['Output 11','In process'],['Output 12','Level 1'],['Output 13','Level 2'],['Output 14','Stable weight']];if(t==='Program Options')r=[['Flow rate','Disabled'],['Scale batching','Disabled'],['EtherNet/IP','Disabled']];if(!r.length)r=[['Status','Demo only'],['Function','See G6 technical manual']];screen.innerHTML=`<div class="screenTitle">${t}</div><div class="screenBody">${r.map((x,i)=>`<div class="valueRow" data-row="${i}"><b>${x[0]}</b><strong>${x[1]}</strong></div>`).join('')}</div>`;soft.innerHTML='<button data-act="esc">ESC</button><button data-act="edit">EDIT</button>'}function edit(){let t=S.editValue,a=t==='Language'?['English','Svenska']:t==='Filter'?['Off','Low','Medium','High']:t==='Display Mode'?['1 Scale','1 & 2 Scales','1 & 2 & 4 Scales']:['100','200','500','1000'];screen.innerHTML=`<div class="screenTitle">Edit: ${t}</div><div class="screenBody"><div class="menuList">${a.map((x,i)=>`<div class="menuItem ${i?'':'sel'}" data-choice="${x}">${x}</div>`).join('')}</div></div>`;soft.innerHTML='<button data-act="confirm">ENTER</button><button data-act="esc">ESC</button>'}function info(){let t=S.view,r='';if(t==='levels')r=S.levelValues.map((x,i)=>`<div class="valueRow"><b>Level ${i+1}</b><strong>${f(x)} kg ${shown()>=x?'ON':'OFF'}</strong></div>`).join('');if(t==='maxmin')r=`<div class="valueRow"><b>Maximum Gross</b><strong>${f(S.max)} kg</strong></div><div class="valueRow"><b>Minimum Gross</b><strong>${f(S.min)} kg</strong></div>`;if(t==='accum')r=`<div class="valueRow"><b>Scale ${S.channel}</b><strong>${f(S.accumulated)} kg</strong></div>`;if(t==='system')r=`<div class="valueRow"><b>Instrument</b><strong>${S.name}</strong></div><div class="valueRow"><b>Program</b><strong>G6 Standard Weighing 2.5.x</strong></div><div class="valueRow"><b>Display</b><strong>5.7” 320×240</strong></div>`;if(t==='clock')r='<div class="valueRow"><b>Date</b><strong>2026-09-24</strong></div><div class="valueRow"><b>Time</b><strong>12:00:00</strong></div>';if(t==='maintenance')r='<div class="valueRow"><b>Diagnostics</b><strong>OK</strong></div><div class="valueRow"><b>Program upgrade</b><strong>Unavailable in simulator</strong></div>';if(t==='network')r='<div class="valueRow"><b>IP Address</b><strong>192.168.1.100</strong></div><div class="valueRow"><b>Protocol</b><strong>HTTP / Modbus TCP</strong></div>';screen.innerHTML=`<div class="screenTitle">${t}</div><div class="screenBody">${r}</div>`;soft.innerHTML='<button data-act="esc">ESC</button><button data-act="reset">RESET</button>'}function keysRender(){let a=['ZERO','TARE','GROSS/NET','PRINT','INFO','↑','↓','ENTER','ESC','F1','F2','F3','F4','F5'];keys.innerHTML=a.map(k=>`<button class="${['INFO','ENTER','ESC'].includes(k)?'dark':''}" data-key="${k}">${k}</button>`).join('')}function enter(){if(S.view==='main'){let x=mainMenu[S.selected],m={'Levels':'levels','Max/Min':'maxmin','Accumulated Weights':'accum','Clock Set-up':'clock','System Information':'system','Maintenance':'maintenance','Network Configuration':'network','Parameter Set-up':'param'};S.view=m[x]||'main';S.selected=0;return render()}if(S.view==='param'){S.sub=paramMenu[S.selected];S.view='sub';S.selected=0;return render()}}function esc(){if(S.view==='edit')S.view='sub';else if(S.view==='sub')S.view='param';else if(S.view==='param'||['levels','maxmin','accum','clock','system','maintenance','network'].includes(S.view))S.view='main';else if(S.view==='main')S.view='weight';render()}keysRender();keys.addEventListener('click',e=>{let k=e.target.dataset.key;if(!k)return;if(k==='INFO'&&S.view==='weight')S.view='main';else if(k==='ESC')esc();else if(k==='ENTER')enter();else if(k==='↑'){S.selected=Math.max(0,S.selected-1);render()}else if(k==='↓'){let n=S.view==='main'?mainMenu.length:S.view==='param'?paramMenu.length:1;S.selected=Math.min(n-1,S.selected+1);render()}else if(k==='ZERO'){S.zero=S.weight;render()}else if(k==='TARE'){S.tare=measured();S.gross=false;render()}else if(k==='GROSS/NET'){S.gross=!S.gross;render()}else if(k==='PRINT'){S.accumulated+=Math.max(0,shown());render()}else if(k==='F3'){S.max=shown();render()}else if(k==='F4'){S.min=shown();render()}});screen.addEventListener('click',e=>{let m=e.target.closest('[data-menu]');if(m){S.selected=+m.dataset.menu;enter()}let r=e.target.closest('[data-row]');if(r&&S.view==='sub'){let i=+r.dataset.row;if(S.sub==='General'&&i===0){S.editValue='Language';S.view='edit'}else if(S.sub==='General'&&i===3){S.editValue='Display Mode';S.view='edit'}else if(S.sub==='Calibration'&&i===4){S.editValue='Filter';S.view='edit'}else if(S.sub==='General'&&i===1){let v=prompt('Instrument Name',S.name);if(v!==null)S.name=v}else if(S.sub==='Calibration'&&i===0){let v=prompt('Capacity kg',S.capacity);if(v!==null)S.capacity=Math.max(1,+v||1000)}render()}let c=e.target.closest('[data-choice]');if(c){let v=c.dataset.choice;if(S.editValue==='Language')S.language=v;if(S.editValue==='Display Mode')S.displayMode=v;if(S.editValue==='Filter')S.filter=v;S.view='sub';render()}});soft.addEventListener('click',e=>{let a=e.target.dataset.act;if(a==='enter'||a==='confirm')enter();if(a==='esc')esc();if(a==='reset'){S.max=shown();S.min=shown();render()}});$('weightInput').addEventListener('input',e=>{S.weight=+e.target.value||0;$('weightRange').value=Math.max(0,Math.min(1000,S.weight));render()});$('weightRange').addEventListener('input',e=>{S.weight=+e.target.value;$('weightInput').value=S.weight;render()});$('channel').addEventListener('change',e=>{S.channel=+e.target.value;render()});$('motion').addEventListener('click',()=>{S.motion=!S.motion;$('motion').textContent='Motion: '+(S.motion?'ON':'OFF');render()});$('levels').addEventListener('click',()=>{S.levels=!S.levels;$('levels').textContent='Levels: '+(S.levels?'ON':'OFF');render()});$('reset').addEventListener('click',()=>location.reload());render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
