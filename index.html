<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="manifest.json">
<title>G6 Simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111418;color:#f1f3f5;font-family:Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:12px}.head{margin:4px 0 12px}.head b{font-size:20px}.head span{display:block;color:#9da5ad;font-size:12px;margin-top:3px}
.sim{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}
.device{position:relative;width:100%;max-width:650px;margin:auto;line-height:0;touch-action:manipulation}
.device img{display:block;width:100%;height:auto;border-radius:4%;user-select:none;-webkit-user-drag:none}
.hit{position:absolute;border:0;background:transparent;padding:0;z-index:4}
.hit:active{background:#ffffff22}.screen{position:absolute;z-index:3;left:31.4%;top:30.1%;width:36.8%;height:29.3%;background:#e7ebee;color:#101214;border:2px solid #30363a;box-shadow:inset 0 0 0 1px #8c9399;line-height:1.15;overflow:hidden;font-size:clamp(7px,1.35vw,12px)}
.screen .bar{height:16%;background:#d2d6d9;border-bottom:1px solid #73797e;padding:2px 4px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.screen .body{padding:3%;height:84%;overflow:auto}.weight{font-size:clamp(23px,5vw,45px);text-align:center;margin:7% 0 1%;font-variant-numeric:tabular-nums}.unit{text-align:center;font-size:clamp(8px,1.6vw,14px)}.status{text-align:center;margin-top:5%;font-size:clamp(7px,1.4vw,12px)}
.menu{background:#fff;border:1px solid #777;color:#111}.mi{padding:3px 5px;border-bottom:1px solid #bbb}.mi:last-child{border:0}.mi.sel{background:#c8cdd1;font-weight:700}.rows .r{display:flex;justify-content:space-between;gap:5px;padding:4px;border-bottom:1px solid #c0c3c5}.rows strong{font-weight:700}
.panel{background:#23282d;border:1px solid #3c434a;border-radius:9px;padding:12px}.panel h2{font-size:14px;margin:0 0 10px}.panel label{display:block;color:#aab2ba;font-size:11px;margin:10px 0 4px}.panel input,.panel select{width:100%;padding:9px;border-radius:6px;border:1px solid #555;background:#15181b;color:#fff;font-size:16px}.panel input[type=range]{padding:0}.panel button{width:100%;padding:10px;margin-top:8px;border-radius:6px;border:1px solid #555;background:#353b42;color:#fff;font-weight:700}.note{font-size:10px;line-height:1.4;color:#9da5ad;margin-top:10px}
.toast{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);background:#050607;color:#fff;padding:9px 13px;border-radius:7px;font-size:13px;opacity:0;transition:.15s;z-index:20}.toast.on{opacity:1}
@media(max-width:720px){.sim{grid-template-columns:1fr}.panel{max-width:650px;margin:auto}.device{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><b>G6 Simulator</b><span>Interaktiv demo • baserad på G6 PM Technical Manual, program version 2.5.x</span></div>
<div class="sim">
<div class="device" id="device">
<img id="unitImg" alt="BLH Nobel G6 panelinstrument">
<div class="screen" id="screen"></div>
<!-- Touch targets mapped to the photographed front panel -->
<button class="hit" style="left:68%;top:19%;width:8%;height:7%" data-k="ESC" aria-label="Escape"></button>
<button class="hit" style="left:77%;top:19%;width:8%;height:7%" data-k="ALT" aria-label="Alt"></button>
<button class="hit" style="left:86%;top:19%;width:8%;height:7%" data-k="INFO" aria-label="Info"></button>
<button class="hit" style="left:68%;top:27%;width:8%;height:7%" data-k="LEFT" aria-label="Left"></button>
<button class="hit" style="left:86%;top:27%;width:8%;height:7%" data-k="RIGHT" aria-label="Right"></button>
<button class="hit" style="left:77%;top:30%;width:9%;height:7%" data-k="UP" aria-label="Up"></button>
<button class="hit" style="left:68%;top:36%;width:9%;height:7%" data-k="LEFT" aria-label="Left"></button>
<button class="hit" style="left:77%;top:36%;width:9%;height:7%" data-k="ENTER" aria-label="Enter"></button>
<button class="hit" style="left:86%;top:36%;width:9%;height:7%" data-k="RIGHT" aria-label="Right"></button>
<button class="hit" style="left:77%;top:42%;width:9%;height:7%" data-k="DOWN" aria-label="Down"></button>
<button class="hit" style="left:68%;top:47%;width:9%;height:7%" data-k="F1" aria-label="F1"></button>
<button class="hit" style="left:78%;top:47%;width:9%;height:7%" data-k="F2" aria-label="F2"></button>
<button class="hit" style="left:88%;top:47%;width:7%;height:7%" data-k="F3" aria-label="F3"></button>
<button class="hit" style="left:68%;top:56%;width:9%;height:7%" data-k="ZERO" aria-label="Zero"></button>
<button class="hit" style="left:78%;top:56%;width:9%;height:7%" data-k="TARE" aria-label="Tare"></button>
<button class="hit" style="left:88%;top:56%;width:7%;height:7%" data-k="PRINT" aria-label="Print"></button>
</div>
<div class="panel">
<h2>Simulerad lastcell</h2>
<label for="w">Vikt (kg)</label>
<input id="w" type="number" value="100" min="-999999" max="999999" step="0.1">
<input id="wr" type="range" min="0" max="1000" value="100" step="0.1">
<label for="ch">Vald kanal</label><select id="ch"><option>1</option><option>2</option><option>3</option><option>4</option></select>
<button id="motion">Motion: OFF</button>
<button id="reset">Återställ</button>
<div class="note">Tryck direkt på de fotograferade knapparna. INFO öppnar huvudmenyn när viktvisningen visas. Menyalternativ kan tryckas direkt på displayen.</div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const img="https://resourcespace-prod.s3.amazonaws.com/rs/filestore/1/7/7/9/2_0daf0c490dd7d64/177921ah_2d93c95177a0252.jpg";
document.getElementById("unitImg").src=img;
const main=["Levels","Setpoints","Preset Tare","Max/Min","Accumulated Weights","Clock Set-up","System Information","Maintenance","Network Configuration","Parameter Set-up"];
const params=["General","Hardware Config.","Calibration","Communication","Level Supervision","Setpoints","Inputs","Outputs","Program Options"];
const s={view:"weight",sel:0,w:100,tare:0,gross:true,zero:0,motion:false,ch:1,max:100,min:100,acc:0,stack:[]};
const screen=document.getElementById("screen"), toastEl=document.getElementById("toast");
function toast(t){toastEl.textContent=t;toastEl.classList.add("on");clearTimeout(window.tt);window.tt=setTimeout(()=>toastEl.classList.remove("on"),900)}
function value(){return s.w-s.zero-(s.gross?0:s.tare)}
function render(){
 let html="";
 if(s.view==="weight") html=`<div class="bar"><span>Scale ${s.ch}</span><span>${s.gross?"Gross":"Net"}</span></div><div class="body"><div class="weight">${value().toFixed(1)}</div><div class="unit">kg</div><div class="status">${s.motion?"MOTION":"Stable"}</div></div>`;
 else if(s.view==="main") html=`<div class="bar"><span>Main Menu</span><span></span></div><div class="body"><div class="menu">${main.map((x,i)=>`<div class="mi ${i===s.sel?"sel":""}" data-i="${i}">${x}</div>`).join("")}</div></div>`;
 else if(s.view==="param") html=`<div class="bar"><span>Parameter Set-up</span></div><div class="body"><div class="menu">${params.map((x,i)=>`<div class="mi ${i===s.sel?"sel":""}" data-p="${i}">${x}</div>`).join("")}</div></div>`;
 else if(s.view==="levels") html=`<div class="bar"><span>Levels</span></div><div class="body rows">${[50,150,250,500].map((x,i)=>`<div class="r"><span>Level ${i+1}</span><strong>${x.toFixed(1)} kg ${value()>=x?"ON":"OFF"}</strong></div>`).join("")}</div>`;
 else if(s.view==="maxmin") html=`<div class="bar"><span>Max / Min</span></div><div class="body rows"><div class="r"><span>Maximum</span><strong>${s.max.toFixed(1)} kg</strong></div><div class="r"><span>Minimum</span><strong>${s.min.toFixed(1)} kg</strong></div></div>`;
 else if(s.view==="acc") html=`<div class="bar"><span>Accumulated Weights</span></div><div class="body rows"><div class="r"><span>Scale ${s.ch}</span><strong>${s.acc.toFixed(1)} kg</strong></div></div>`;
 else if(s.view==="info") html=`<div class="bar"><span>System Information</span></div><div class="body rows"><div class="r"><span>Program</span><strong>2.5.x</strong></div><div class="r"><span>Display</span><strong>5.7" 320×240</strong></div><div class="r"><span>Simulator</span><strong>PWA</strong></div></div>`;
 else if(s.view==="submenu") html=`<div class="bar"><span>${s.stack[s.stack.length-1]}</span></div><div class="body rows">${subRows(s.stack[s.stack.length-1])}</div>`;
 screen.innerHTML=html;
}
function subRows(t){
const rows={General:[["Language","English"],["Instrument Name","G6 DEMO"],["Start Mode","Auto"],["Display Modes","1 & 2 & 4 Scales"],["Gross/Net key","On"],["Tare key","On"],["F3 key","P.Tare"],["F4 key","Levels"]],
"Calibration":[["Capacity","1000 kg"],["Division","0.1 kg"],["Tare Corr. Mode","Auto + Preset"],["Filter","Medium"]],
"Communication":[["Serial","RS485 / Modbus RTU"],["Ethernet","Modbus TCP"],["Fieldbus","PROFINET / PROFIBUS / DeviceNet"]],
"Hardware Config.":[["Weight input","WFIN/WFIN2"],["Channels","1–8"],["Digital I/O","4 in / 2 out"]]}[t]||[["Status","Demo"]];return rows.map(r=>`<div class="r"><span>${r[0]}</span><strong>${r[1]}</strong></div>`).join("")}
function goMain(){s.view="main";s.sel=0;render()}
function esc(){if(s.view==="weight")return; if(s.view==="submenu")s.view=s.stack.length>1?(s.stack.pop(),"submenu"):"param";else if(s.view==="param")s.view="main";else s.view="weight";s.sel=0;render()}
function enter(){
if(s.view==="main"){const x=main[s.sel];const m={"Levels":"levels","Max/Min":"maxmin","Accumulated Weights":"acc","System Information":"info","Parameter Set-up":"param"};if(m[x])s.view=m[x];else toast(x+" – demo");s.sel=0;render()}
else if(s.view==="param"){s.stack=[params[s.sel]];s.view="submenu";s.sel=0;render()}
}
document.querySelectorAll(".hit").forEach(b=>b.addEventListener("pointerup",e=>{e.preventDefault();key(b.dataset.k)}));
screen.addEventListener("pointerup",e=>{const mi=e.target.closest("[data-i]");if(mi){s.sel=+mi.dataset.i;enter();return}const mp=e.target.closest("[data-p]");if(mp){s.sel=+mp.dataset.p;enter();return}});
function key(k){
if(k==="INFO"&&s.view==="weight"){goMain();return}
if(k==="ESC"){esc();return}
if(k==="UP"){if(s.view==="main")s.sel=Math.max(0,s.sel-1);else if(s.view==="param")s.sel=Math.max(0,s.sel-1);render();return}
if(k==="DOWN"){const n=s.view==="main"?main.length:s.view==="param"?params.length:1;s.sel=Math.min(n-1,s.sel+1);render();return}
if(k==="ENTER"){enter();return}
if(k==="ZERO"){s.zero=s.w;toast("ZERO");render();return}
if(k==="TARE"){s.tare=s.w-s.zero;s.gross=false;toast("TARE");render();return}
if(k==="PRINT"){s.acc+=Math.max(0,value());toast("PRINT / ACCUMULATE");render();return}
}
document.getElementById("w").addEventListener("input",e=>{s.w=Number(e.target.value)||0;document.getElementById("wr").value=Math.max(0,Math.min(1000,s.w));s.max=Math.max(s.max,value());s.min=Math.min(s.min,value());render()});
document.getElementById("wr").addEventListener("input",e=>{s.w=Number(e.target.value);document.getElementById("w").value=s.w;s.max=Math.max(s.max,value());s.min=Math.min(s.min,value());render()});
document.getElementById("ch").addEventListener("change",e=>{s.ch=+e.target.value;render()});
document.getElementById("motion").addEventListener("click",()=>{s.motion=!s.motion;document.getElementById("motion").textContent="Motion: "+(s.motion?"ON":"OFF");render()});
document.getElementById("reset").addEventListener("click",()=>location.reload());
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
